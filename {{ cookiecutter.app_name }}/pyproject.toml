[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "{{ cookiecutter.app_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.short_description }}"
authors = [{name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.email }}"}]
readme = "README.md"
license = "{{ cookiecutter.license }}"
license-files = ["LICENSE"]
keywords = []
classifiers = [
    "{{ cookiecutter.development_status }}",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    {% for minor in range(cookiecutter.min_python_version.split('.')[1] | int, 16) -%}
    "Programming Language :: Python :: 3.{{ minor }}",
    {% endfor -%}
    "Typing :: Typed",
]
requires-python = ">={{ cookiecutter.min_python_version }}, <4"
dependencies = [
    "click",
{%- if cookiecutter.use_rich %}
    "rich-click",
{%- endif %}
]

[dependency-groups]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinxext-opengraph",
]
tests = [
    "pytest",
    "pytest-cov",
]
typing = [
    "mypy",
    "pyrefly",
    "pyright[nodejs]",
    "ty",
    "zuban",
]
dev = [
    { include-group = "docs" },
    { include-group = "tests" },
    { include-group = "typing" },
    "cogapp",
    "prek",
]

[project.urls]
Documentation = "https://{{ cookiecutter.app_name }}.readthedocs.io/en/stable/"
Changelog = "https://{{ cookiecutter.app_name }}.readthedocs.io/en/stable/changelog.html"
"Source Code" = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.app_name }}"
"Issue Tracker" = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.app_name }}/issues"

[project.scripts]
{{ cookiecutter.app_name }} = "{{ cookiecutter.package_name }}.__main__:cli"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma (flake8-commas), handled by the formatter
    "CPY001",  # missing-copyright-notice (flake8-copyright)
    "D102",  # undocumented-public-method (pydocstyle)
    "D105",  # undocumented-magic-method (pydocstyle)
    "D107",  # undocumented-public-init (pydocstyle)
    "E501",  # line-too-long (pycodestyle), handled by the formatter
    "PLC2401",  # non-ascii-name (Pylint)
    "S101",   # assert (flake8-bandit)
    "SLF001",  # private-member-access (flake8-self)
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # unused-import (Pyflakes)
]
"docs/conf.py" = [
    "INP001",  # implicit-namespace-package (flake8-no-pep420)
]
"src/{{ cookiecutter.package_name }}/cli.py" = [
    "A001",  # builtin-variable-shadowing (flake8-builtins)
    "A002",  # builtin-argument-shadowing (flake8-builtins)
    "C901",  # complex-structure (mccabe)
    "FBT001",  # boolean-type-hint-positional-argument (flake8-boolean-trap)
    "PLR0913",  # too-many-arguments (Pylint)
]
"tests/**/test_*.py" = [
    "D",  # pydocstyle
    "PLR2004",   # magic-value-comparison (Pylint)
    "S101",   # assert (flake8-bandit)
    "SIM300",   # yoda-conditions (flake8-simplify)
]
"tests/smoke_test.py" = [
    "D",  # pydocstyle
    "PLR2004",   # magic-value-comparison (Pylint)
    "S101",  # assert (flake8-bandit)
]
"tests/utils.py" = [
    "ANN401",  # any-type (flake8-annotations)
]

[tool.ty.src]
include = ["src", "tests"]

[tool.mypy]
python_version = "{{ cookiecutter.min_python_version }}"
files = ["tests"]

[tool.pyrefly]
project-includes = ["tests"]
search-path = ["tests"]

[tool.pyright]
include = ["tests"]
pythonVersion = "{{ cookiecutter.min_python_version }}"

[tool.zuban]
python_version = "{{ cookiecutter.min_python_version }}"
files = ["tests"]
